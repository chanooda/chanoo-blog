on:
  push:
    branches: ["main"]
    # paths: ["apps/blog-admin/**"]

jobs:
  deploy-admin:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Create .npmrc file
        run: |
          cat <<EOF > ~/.npmrc
              @chanooda:registry=https://npm.pkg.github.com/
              //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
          EOF

      - name: Create .env file
        working-directory: apps/blog-admin
        run: |
          touch .env
          jq -r 'to_entries
            | map(select(.key | startswith("GCP") | not))
            | map("\(.key)=\(.value|tostring)")
            | .[]' <<< "$SECRETS_CONTEXT" > .env
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/blog-admin
        run: pnpm build

      - name: Create deployment package
        working-directory: apps/blog-admin
        run: |
          mkdir -p blog-admin-deploy
          cp -r nginx blog-admin-deploy/
          cp -a .env blog-admin-deploy/.
          cp deploy.sh blog-admin-deploy/
          cp nginx.conf.template blog-admin-deploy/.
          cp nginx.inc.template blog-admin-deploy/. || true
          tar czf blog-admin-deploy.tar.gz -C blog-admin-deploy .

      - name: Get Public IP
        id: ip
        run: echo "ipv4=$(curl -s https://ipinfo.io/ip)" >> $GITHUB_OUTPUT

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Open Firewall
        run: |
          gcloud compute firewall-rules create allow-gh-${{ github.run_id }} \
          --action=ALLOW --rules=tcp:5000 --source-ranges=${{ steps.ip.outputs.ipv4 }} \
          --target-tags=docker-registry

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: chanoo.dev:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./apps/blog-admin
          push: true
          tags: |
            chanoo.dev:5000:5000/blog-admin-app:latest
            chanoo.dev:5000:5000/blog-admin-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha, mode=max

      - name: Copy deployment package to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.GCP_SSH_PASSWORD }}
          port: 22
          source: "apps/blog-admin/blog-admin-deploy.tar.gz"
          target: /home/${{ secrets.GCP_VM_USER }}/blog-admin

      - name: SSH to VM and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.GCP_SSH_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /home/${{ secrets.GCP_VM_USER }}/blog-admin
            tar -xzf blog-admin-deploy.tar.gz
            rm -rf blog-admin-deploy.tar.gz
            chmod +x deploy.sh
            LOG_DIR=/home/${{ secrets.GCP_VM_USER }}/blog-admin/logs
            mkdir -p "$LOG_DIR"
            TS=$(date +"%Y%m%d-%H%M%S")
            LOG_FILE="$LOG_DIR/deploy-$TS.log"
            nohup bash -c "REMOVE_OLD_CONTAINER_ON_DEPLOY=true ./deploy.sh > $LOG_FILE 2>&1" >/dev/null 2>&1 &
            echo "배포 스크립트를 백그라운드로 실행했습니다. PID: $!"
      - name: Cleanup
        if: always()
        run: |
          rm -f blog-admin-deploy.tar.gz
          rm -rf apps/blog-admin/blog-admin-deploy
          gcloud compute firewall-rules delete allow-gh-${{ github.run_id }} --quiet || echo "방화벽 규칙이 이미 삭제되었거나 존재하지 않습니다."
